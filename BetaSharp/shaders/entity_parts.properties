# Entity model part ID mapping for shader per-part effects.
# Format: bbmodel_bone_name = logical_id
# ID 0 is reserved for "unknown/unnamed" — shaders should treat it as a no-op passthrough.
# Names are the bone names in OmniBlock/assets/models/*.bbmodel and match case-insensitively.
#
# Unlike the texture ids this is not per-entity: a bone name is only unique within its model, so
# `head` and `wolfHeadMain` are separate entries rather than one. Pair it with the entityId uniform
# to address a single part of a single mob. Shared ids group; the 100 band below does that for the
# limbs every quadruped has, while every bone keeps an id of its own for fine-grained work.

# Biped — player, zombie, skeleton, pig zombie
bipedHead = 1
bipedHeadwear = 2
bipedBody = 3
bipedRightArm = 4
bipedLeftArm = 5
bipedRightLeg = 6
bipedLeftLeg = 7
bipedEars = 8
bipedCloak = 9

# Quadruped — cow, pig, sheep
head = 10
body = 11
leg1 = 100
leg2 = 100
leg3 = 100
leg4 = 100
udders = 12

# Chicken
bill = 20
chin = 21
rightWing = 22
leftWing = 23
rightLeg = 24
leftLeg = 25

# Wolf
wolfHeadMain = 30
wolfBody = 31
wolfMane = 32
wolfTail = 33
wolfSnout = 34
wolfLeftEar = 35
wolfRightEar = 36
wolfLeg1 = 100
wolfLeg2 = 100
wolfLeg3 = 100
wolfLeg4 = 100

# Spider
spiderHead = 40
spiderNeck = 41
spiderBody = 42
spiderLeg1 = 100
spiderLeg2 = 100
spiderLeg3 = 100
spiderLeg4 = 100
spiderLeg5 = 100
spiderLeg6 = 100
spiderLeg7 = 100
spiderLeg8 = 100

# Ghast

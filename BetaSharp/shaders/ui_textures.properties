# UI Texture ID mapping for shader per-texture effects.
# Format: asset_path = logical_id
# ID 0 is reserved for "unknown/unregistered" — shaders should treat it as a no-op passthrough.
# Shader authors: #define constants matching these IDs to branch on u_TextureId.
#
# Example inverted-theme fragment shader:
#   #define TEX_GUI      2
#   #define TEX_ICONS    3
#   if (u_TextureId == TEX_GUI || u_TextureId == TEX_ICONS)
#       FragColor.rgb = vec3(1.0) - FragColor.rgb;

font/default.png = 1
gui/gui.png = 2
gui/icons.png = 3
gui/items.png = 4
terrain.png = 5
gui/background.png = 6
gui/furnace.png = 7
achievement/bg.png = 8
title/mclogo.png = 9
gui/unknown_pack.png = 10
gui/inventory.png = 11
gui/container.png = 12
gui/crafting.png = 13
gui/trap.png = 14
misc/vignette.png = 15
misc/pumpkinblur.png = 16

# UI Texture ID mapping for shader per-texture effects.
# Format: asset_path = logical_id
# ID 0 is reserved for "unknown/unregistered" — shaders should treat it as a no-op passthrough.
# Multiple paths can share the same id to group textures for a shader branch,
# e.g. all inventory/container screens share id 100 below.

achievement/bg.png = 100
font/default.png = 1
gui/background.png = 2
gui/container.png = 100
gui/crafting.png = 100
gui/furnace.png = 100
gui/gui.png = 3
gui/icons.png = 4
gui/inventory.png = 100
gui/items.png = 5
gui/trap.png = 100
gui/unknown_pack.png = 6
misc/pumpkinblur.png = 7
misc/vignette.png = 8
terrain.png = 9
title/mclogo.png = 10

# Entity texture ID mapping for shader per-entity effects.
# Format: asset_path = logical_id
# ID 0 is reserved for "unknown/unregistered" — shaders should treat it as a no-op passthrough.
# Multiple paths can share the same id to group entities for a shader branch; ids below 100 stay
# one-per-texture so anything remains individually addressable, and the 100 band is left for groups.
mob/char.png=1
mob/chicken.png=2
mob/cow.png=3
mob/creeper.png=4
mob/ghast.png=5
mob/ghast_fire.png=6
mob/pig.png=7
mob/pigzombie.png=8
mob/saddle.png=9
mob/sheep.png=10
mob/sheep_fur.png=11
mob/skeleton.png=12
mob/slime.png=13
mob/spider.png=14
mob/spider_eyes.png=15
mob/squid.png=16
mob/wolf.png=17
mob/wolf_angry.png=18
mob/wolf_tame.png=19
mob/zombie.png=20
armor/power.png=30
art/kz.png=31
item/arrows.png=32
